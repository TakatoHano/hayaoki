name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        include:
          - os: macos-latest
            ruby: "4.0"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install gems
        run: gem install --no-document minitest rake rails bootsnap
      - name: Test
        run: ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].each { load _1 }'

  rails-compat:
    # 古い Rails でも probe と集計が動くこと。fixture の Gemfile は rails を固定しないので、入れた版が使われる
    name: rails ${{ matrix.rails }} (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rails: "7.0", ruby: "3.2" }
          - { rails: "7.1", ruby: "3.3" }
          - { rails: "7.2", ruby: "3.4" }
          - { rails: "8.0", ruby: "3.4" }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install gems
        run: |
          gem install --no-document minitest rake bootsnap
          gem install --no-document --conservative rails -v "~> ${{ matrix.rails }}.0"
          gem list '^(rails|railties|zeitwerk|concurrent-ruby)$'
      - name: Test
        run: ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].each { load _1 }'

  ai-words:
    # AI らしい日本語の語彙チェック (tools/ai-words)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/ai-words/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tools/ai-words
      - run: node tools/ai-words/check.mjs --github
