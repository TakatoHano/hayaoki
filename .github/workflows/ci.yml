name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        include:
          - os: macos-latest
            ruby: "4.0"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install gems
        run: gem install --no-document minitest rake rails bootsnap
      - name: Test
        run: ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].each { load _1 }'
